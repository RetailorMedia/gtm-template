    changeNotes: >-
      Reliable per-event delivery: each tag firing now sends its own
      self-contained hit (own event name + custom variables) instead of relying
      on a single automatic hit and shared state. Fixes missing custom variables
      and events dropped when multiple Retailor tags fire on the same page load.
      Requires re-accepting the tag permissions.
